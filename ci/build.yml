# ═══════════════════════════════════════════════════════════════════════════
#  ЭТО ШАБЛОН ДЛЯ РУЧНОГО ОБНОВЛЕНИЯ. Файл не рабочий в папке ci/ —
#  GitHub Actions слушает только .github/workflows/.
#
#  Что сделать (с телефона, веб-GitHub):
#    1. Открой .github/workflows/build.yml → карандаш (Edit)
#    2. Удали всё содержимое и вставь содержимое ЭТОГО файла (после блока
#       комментариев — начиная со строки `name:`)
#    3. Commit changes прямо в main1
#    4. Аналогично создай .github/workflows/deploy-server.yml из ci/deploy-server.yml
#
#  Отличия от старого варианта (обратно/вперёд-совместим с любым кодом):
#    - шаг Inject: подставляет BZW_SECRET/BZW_HOST из Secrets в license.cpp,
#      если модуль защиты уже смержен; если его в ветке нет — шаг пропускается
#    - артефакт берётся по маске libs/arm64-v8a/*.sh (работает и со старым
#      xvcen.sh, и с новым benzware.sh)
# ═══════════════════════════════════════════════════════════════════════════
name: Build benzware.sh

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

# Бинарник только собирается и загружается как artifact.
# Автоматический git push отключён, чтобы избежать non-fast-forward.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.3.11579264

jobs:
  build:
    name: Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Inject license server settings
        # Хост/секрет сервера лицензий — только в GitHub Secrets. На ветках без
        # модуля защиты шаг пропускается; где модуль есть, а BZW_SECRET не задан —
        # упадёт с понятной ошибкой (так задумано).
        env:
          BZW_SECRET: ${{ secrets.BZW_SECRET }}
          BZW_HOST: ${{ secrets.BZW_HOST }}
        shell: bash
        run: |
          if [ -f tools/protect/inject_settings.py ]; then
            python3 tools/protect/inject_settings.py jni/src/license.cpp
          else
            echo "модуля защиты в этой ветке нет — подстановка пропущена"
          fi

      - name: Build
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh

          ART="$(ls libs/arm64-v8a/*.sh | head -n1)"
          echo "ARTIFACT=${ART}" >> "${GITHUB_ENV}"
          file "${ART}"
          sha256sum "${ART}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: benzware-sh-arm64-v8a
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
