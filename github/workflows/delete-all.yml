name: Global Clear Artifacts
on: workflow_dispatch

jobs:
  clear-all-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Запрашиваем артефакты со всего репозитория (все ветки вместе)
            const res = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            console.log(`Найдено артефактов для удаления: ${res.data.artifacts.length}`);
            
            for (const art of res.data.artifacts) {
              console.log(`Удаляю артефакт "${art.name}", созданный в ветке: ${art.workflow_run.head_branch}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: art.id
              });
            }
            
