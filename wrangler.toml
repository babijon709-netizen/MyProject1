name = "cheat-killswitch"
main = "server/cloudflare-worker/src/index.js"
compatibility_date = "2024-01-01"

# Для GitHub интеграции - файл должен быть в корне репо
# Если хочешь KV persistence - раскомментируй и вставь ID:
# [[kv_namespaces]]
# binding = "CHEAT_KV"
# id = "YOUR_KV_ID"

[vars]
DEFAULT_ENABLED = "true"
CHEAT_VERSION = "1.0.0"
MIN_VERSION = "1.0.0"
