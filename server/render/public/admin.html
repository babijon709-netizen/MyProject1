<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheat Admin Panel</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;background:#0f0f0f;color:#eee;min-height:100vh;margin:0;padding:20px;display:flex;justify-content:center}
  .container{max-width:600px;width:100%}
  h1{text-align:center;color:#fff}
  .card{background:#1e1e1e;border-radius:12px;padding:20px;margin:20px 0;border:1px solid #333}
  .status{font-size:20px;padding:15px;border-radius:8px;text-align:center;margin:15px 0}
  .enabled{background:#143314;border:2px solid #2a6a2a;color:#8f8}
  .disabled{background:#331414;border:2px solid #6a2a2a;color:#f88}
  input,textarea{width:100%;padding:10px;margin:8px 0;background:#2a2a2a;border:1px solid #444;color:#fff;border-radius:6px}
  button{padding:12px 20px;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin:5px;transition:0.2s}
  .btn-on{background:#2a7a2a;color:white}.btn-on:hover{background:#3a9a3a}
  .btn-off{background:#7a2a2a;color:white}.btn-off:hover{background:#9a3a3a}
  .btn-save{background:#2a4a7a;color:white}.btn-save:hover{background:#3a5a9a}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row button{flex:1}
  label{color:#aaa;font-size:14px}
  .log{background:#111;padding:10px;border-radius:6px;font-family:monospace;font-size:12px;max-height:200px;overflow-y:auto;white-space:pre-wrap}
  .secret-box{display:flex;gap:10px}
  .secret-box input{flex:1}
</style>
</head>
<body>
<div class="container">
  <h1>🛡️ Админ панель чита</h1>
  
  <div class="card">
    <label>Admin Secret:</label>
    <div class="secret-box">
      <input type="password" id="secret" placeholder="Введи ADMIN_SECRET">
      <button onclick="toggleSecret()" style="padding:10px">👁️</button>
    </div>
    <small style="color:#888">Берется из URL ?secret= или вводи вручную. Секрет из ENV ADMIN_SECRET на Render</small>
  </div>

  <div class="card">
    <div id="status" class="status">Загрузка...</div>
    <div id="details" style="font-size:14px;color:#aaa"></div>
    
    <label>Сообщение для юзеров (показывается если выкл):</label>
    <textarea id="message" rows="2" placeholder="Cheat disabled..."></textarea>
    
    <div class="row">
      <div style="flex:1">
        <label>Версия чита:</label>
        <input type="text" id="version" placeholder="1.0.0">
      </div>
      <div style="flex:1">
        <label>Мин. версия:</label>
        <input type="text" id="min_version" placeholder="1.0.0">
      </div>
    </div>

    <div class="row" style="margin-top:15px">
      <button class="btn-on" onclick="setEnabled(true)">✅ ВКЛЮЧИТЬ ЧИТ</button>
      <button class="btn-off" onclick="setEnabled(false)">❌ ВЫКЛЮЧИТЬ ЧИТ</button>
    </div>
    <button class="btn-save" style="width:100%;margin-top:10px" onclick="saveAll()">💾 Сохранить сообщение/версию</button>
  </div>

  <div class="card">
    <h3>Быстрые действия</h3>
    <div class="row">
      <button onclick="setMessage('Cheat disabled by admin - maintenance')" class="btn-off">Тех. работы</button>
      <button onclick="setMessage('Cheat disabled - new version required, contact admin')" class="btn-off">Требуется обновление</button>
      <button onclick="setMessage('Cheat active - have fun!')" class="btn-on">Активен</button>
    </div>
  </div>

  <div class="card">
    <h3>Лог</h3>
    <div id="log" class="log">Готов...</div>
  </div>
</div>

<script>
let currentState = null;

function getSecret() {
  return document.getElementById('secret').value.trim();
}
function log(msg) {
  const el = document.getElementById('log');
  el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + el.textContent;
}

function toggleSecret() {
  const inp = document.getElementById('secret');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function loadState() {
  const secret = getSecret();
  if (!secret) {
    document.getElementById('status').textContent = 'Введи SECRET';
    document.getElementById('status').className = 'status disabled';
    return;
  }
  try {
    const res = await fetch(`/api/admin/state?secret=${encodeURIComponent(secret)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    currentState = data;
    renderState(data);
    log(`Загружено: enabled=${data.enabled} checks=${data.total_checks}`);
  } catch (e) {
    document.getElementById('status').textContent = 'Ошибка: ' + e.message;
    document.getElementById('status').className = 'status disabled';
    log('Ошибка загрузки: ' + e.message);
  }
}

function renderState(s) {
  const st = document.getElementById('status');
  st.textContent = s.enabled ? '✅ ЧИТ ВКЛЮЧЕН - юзеры могут играть' : '❌ ЧИТ ВЫКЛЮЧЕН - никто не может играть';
  st.className = 'status ' + (s.enabled ? 'enabled' : 'disabled');
  document.getElementById('details').innerHTML = `
    Версия: ${s.version} | Мин: ${s.min_version}<br>
    Обновлено: ${new Date(s.updated_at).toLocaleString()}<br>
    Проверок: ${s.total_checks} | Отклонено: ${s.disabled_count}<br>
    Сообщение: ${s.message}
  `;
  document.getElementById('message').value = s.message;
  document.getElementById('version').value = s.version;
  document.getElementById('min_version').value = s.min_version;
}

async function apiUpdate(payload) {
  const secret = getSecret();
  if (!secret) { alert('Введи SECRET!'); return null; }
  try {
    const res = await fetch('/api/admin/status', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({secret, ...payload})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    currentState = data.state;
    renderState(data.state);
    log(`Обновлено: ${JSON.stringify(payload)}`);
    return data.state;
  } catch (e) {
    alert('Ошибка: ' + e.message);
    log('Ошибка обновления: ' + e.message);
    return null;
  }
}

function setEnabled(enabled) {
  const msg = document.getElementById('message').value || (enabled ? 'Cheat active' : 'Cheat disabled by admin');
  apiUpdate({enabled, message: msg});
}
function setMessage(msg) {
  document.getElementById('message').value = msg;
  apiUpdate({message: msg});
}
function saveAll() {
  apiUpdate({
    message: document.getElementById('message').value,
    version: document.getElementById('version').value,
    min_version: document.getElementById('min_version').value
  });
}

// Auto load secret from URL
window.onload = () => {
  const urlParams = new URLSearchParams(window.location.search);
  const sec = urlParams.get('secret');
  if (sec) document.getElementById('secret').value = sec;
  if (document.getElementById('secret').value) loadState();
  // Reload every 10 sec
  setInterval(() => { if (getSecret()) loadState(); }, 10000);
};
document.getElementById('secret').addEventListener('change', loadState);
</script>
</body>
</html>
