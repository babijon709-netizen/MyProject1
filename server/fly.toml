# Конфиг Fly.io для лицензионного сервера (PROTECTION.md, вариант B).
# Имя приложения должно быть уникальным на весь fly.io — если при launch
# скажут, что занято, допиши цифр/ник в первой строке.
app = "benzware-license-server"
primary_region = "ams"          # Амстердам: близко и к тебе, и к RU-пользователям

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"                 # внутренний порт внутри машины (см. internal_port)
  DB_PATH = "/data/db.json"     # база ключей — на персистентном volume

# ВАЖНО: force_https = false. Наш клиент ходит голым HTTP+HMAC (подмена
# закрыта подписью), редирект на HTTPS его бы сломал.
[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = "off"    # сервер нужен 24/7: kill-switch приходит клиентам в любой момент
  auto_start_machines = true
  min_machines_running = 1

[deploy]
  strategy = "immediate"        # volume один — машина заменяется на месте, без rolling

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
  cpu_kind = "shared"

[mounts]
  source = "xvc_data"
  destination = "/data"
