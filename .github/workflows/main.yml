name: Delete all artifacts
on: workflow_dispatch
permissions:
  actions: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=babijon709-netizen/MyProject1
          echo "Было:"
          gh api repos/$REPO/actions/artifacts --jq '.total_count'
          gh api --paginate repos/$REPO/actions/artifacts --jq '.artifacts[].id' | while read id; do
            echo "Удаляю $id"
            gh api -X DELETE repos/$REPO/actions/artifacts/$id
          done
          echo "Стало:"
          gh api repos/$REPO/actions/artifacts --jq '.total_count'
