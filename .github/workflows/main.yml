name: Delete all artifacts
on: workflow_dispatch
permissions:
  actions: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=babijon709-netizen/MyProject1
          gh api --paginate repos/$REPO/actions/runs --jq '.workflow_runs[] | select(.status=="completed") | .id' | xargs -P 8 -I{} gh api -X DELETE repos/$REPO/actions/runs/{}
