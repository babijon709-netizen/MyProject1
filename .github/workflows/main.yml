name: Build xvcen.sh

on:
  push:
    branches:
      - arena/01a020ff-myproject1

  pull_request:
    branches:
      - arena/01a020ff-myproject1

  workflow_dispatch:

# Бинарник только собирается и загружается как artifact.
# Автоматический git push отключён, чтобы избежать non-fast-forward.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.3.11579264

jobs:
  build:
    name: Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh

          file libs/arm64-v8a/xvcen.sh
          sha256sum libs/arm64-v8a/xvcen.sh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: xvcen-sh-arm64-v8a
          path: libs/arm64-v8a/xvcen.sh
          if-no-files-found: error
