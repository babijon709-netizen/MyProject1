name: Delete all artifacts
on: workflow_dispatch
permissions:
  actions: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate repos/babijon709-netizen/MyProject1/actions/artifacts --jq '.artifacts[].id' | xargs -I{} gh api -X DELETE repos/babijon709-netizen/MyProject1/actions/artifacts/{}
