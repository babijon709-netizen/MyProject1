name: Diag build (log back to branch)

on:
  push:
    branches:
      - arena/01a1067f-myproject1
  workflow_dispatch: # <--- ДОБАВЛЕНО: эта строчка включает кнопку ручного запуска

permissions:
  contents: write

concurrency:
  group: diag-build
  cancel-in-progress: true

env:
  NDK_VERSION: 26.3.11579264

jobs:
  diag:
    name: NDK diag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Build (log captured, step never fails)
        shell: bash
        run: |
          set +e
          {
            echo "sdkmanager list ok"
            ls "${ANDROID_SDK_ROOT}" || true
          } > ci-diag.log 2>&1
          "${ANDROID_NDK_HOME}/ndk-build" \
            NDK_PROJECT_PATH="${GITHUB_WORKSPACE}" \
            APP_BUILD_SCRIPT="${GITHUB_WORKSPACE}/jni/Android.mk" \
            NDK_APPLICATION_MK="${GITHUB_WORKSPACE}/jni/Application.mk" \
            V=1 >> ci-diag.log 2>&1
          echo "NDK-BUILD-EXIT-CODE=$?" >> ci-diag.log

      - name: Push log back to branch
        if: always()
        shell: bash
        run: |
          git config user.email "arena-agent@users.noreply.github.com"
          git config user.name "arena-agent"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git add ci-diag.log
          git commit -m "CI diag: ndk-build log (run ${GITHUB_RUN_NUMBER})" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          
