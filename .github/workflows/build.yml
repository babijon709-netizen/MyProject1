name: Build xvcen

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

# write — шаг «Release binary» кладёт бинарник в релиз nightly.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.3.11579264

jobs:
  build:
    name: Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        run: |
          "${ANDROID_NDK_HOME}/ndk-build" \
            NDK_PROJECT_PATH="${GITHUB_WORKSPACE}" \
            APP_BUILD_SCRIPT="${GITHUB_WORKSPACE}/jni/Android.mk" \
            NDK_APPLICATION_MK="${GITHUB_WORKSPACE}/jni/Application.mk" \
            V=1

          test -f "${GITHUB_WORKSPACE}/libs/arm64-v8a/xvcen"

          mkdir -p dist
          cp "${GITHUB_WORKSPACE}/libs/arm64-v8a/xvcen" \
             dist/xvcen-arm64-v8a

          file dist/xvcen-arm64-v8a
          sha256sum dist/xvcen-arm64-v8a

      - name: Upload binary
        id: upload
        uses: actions/upload-artifact@v4
        # Квота хранилища артефактов — не причина ронять сборку: бинарник уже
        # собран и проверен (test -f + sha256 выше), заливка только его
        # выгружает. Перезапись и короткий срок держат расход квоты в одном
        # артефакте: каждая сборка не копится поверх предыдущих.
        continue-on-error: true
        with:
          name: xvcen-arm64-v8a
          path: dist/xvcen-arm64-v8a
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      - name: Release binary
        id: release
        if: always() && hashFiles('dist/xvcen-arm64-v8a') != ''
        # Ассеты релиза лежат в другом хранилище, а не в квоте артефактов
        # Actions, — то есть доступны сразу, не дожидаясь пересчёта раз в
        # 6-12 ч. Тег один и тот же, файл перезаписывается --clobber.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 ||
            gh release create nightly \
              --target "${GITHUB_SHA}" \
              --title "nightly (${GITHUB_REF_NAME})" \
              --notes "Автосборка ветки ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA}" \
              --prerelease
          gh release upload nightly dist/xvcen-arm64-v8a --clobber
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/tag/nightly" >> "$GITHUB_OUTPUT"

      - name: Итог сборки
        if: always() && hashFiles('dist/xvcen-arm64-v8a') != ''
        run: |
          if [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "артефакт залит: xvcen-arm64-v8a"
          else
            # continue-on-error не красит джоб, но строка CreateArtifact в логе
            # остаётся и читается как провал сборки. Пишем прямо: бинарник
            # собран, не залит только артефакт, и это квота, а не код.
            echo "::warning::артефакт Actions не залит (квота, пересчёт 6-12 ч) —"
            echo "::warning::бинарник берём из релиза, ссылка ниже."
          fi
          if [ "${{ steps.release.outcome }}" = "success" ]; then
            echo "релиз: ${{ steps.release.outputs.url }}"
          else
            echo "::error::релиз nightly не залился — смотри лог шага выше"
          fi
          sha256sum dist/xvcen-arm64-v8a
