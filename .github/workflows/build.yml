name: Build xvcen (arm64-v8a)

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

# Бинарник только собирается и публикуется (artifact + ассет релиза).
# Автоматический git push отключён, чтобы избежать non-fast-forward;
# contents: write нужен только для тега/релиза со сборкой.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.3.11579264

jobs:
  build:
    name: Android arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}"

          {
            echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          } >> "${GITHUB_ENV}"

      # jni/tests — хост-прогон без NDK (g++): падение теста не должно выглядеть
      # как падение сборки, поэтому отдельный шаг.
      - name: Host unit tests
        shell: bash
        run: bash scripts/host_tests.sh

      - name: Build
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh

      # Артефактное хранилище — общий лимит аккаунта (500 МБ на free-плане), и
      # он уже выбран: upload падает «Artifact storage quota has been hit»,
      # роняя весь прогон. Сборка от этого не ломается, поэтому шаг
      # необязательный — бинарник всё равно уезжает ассетом релиза ниже.
      - name: Upload artifact (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: xvcen-arm64-v8a
          path: libs/arm64-v8a/xvcen
          if-no-files-found: error
          retention-days: 7

      # Ассеты релиза в лимит артефактов не входят: один rolling-релиз на ветку,
      # ассет перезаписывается каждым прогоном (--clobber), так что они не копятся.
      - name: Publish release asset
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci/$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-')"
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "CI: ${GITHUB_REF_NAME}" \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --notes "Сборка xvcen (arm64-v8a) из ветки ${GITHUB_REF_NAME}. Ассет перезаписывается каждым прогоном." \
              || echo "::warning::релиз ${TAG} создать не удалось — пробуем залить ассеты в существующий"
          fi
          sha256sum libs/arm64-v8a/xvcen > libs/arm64-v8a/xvcen.sha256
          gh release upload "${TAG}" libs/arm64-v8a/xvcen libs/arm64-v8a/xvcen.sha256 --clobber
          gh release view "${TAG}" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
