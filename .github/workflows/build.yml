name: Build xvcen (arm64-v8a)

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

# Бинарник только собирается и загружается как artifact.
# Автоматический git push отключён, чтобы избежать non-fast-forward.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.3.11579264

jobs:
  build:
    name: Android arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}"

          {
            echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          } >> "${GITHUB_ENV}"

      # jni/tests — хост-прогон без NDK (g++): падение теста не должно выглядеть
      # как падение сборки, поэтому отдельный шаг.
      - name: Host unit tests
        shell: bash
        run: bash scripts/host_tests.sh

      - name: Build
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: xvcen-arm64-v8a
          path: libs/arm64-v8a/xvcen
          if-no-files-found: error
