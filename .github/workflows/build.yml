name: Build benzware.sh

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.3.11579264

jobs:
  build:
    name: Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Установка Node.js (нужен для вашего шага node tests/remote_gate/worker.test.mjs)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Проверенный и надежный способ установки NDK через стандартный android-actions
      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.3.11579264'

      # Автоматически прописываем пути к NDK, которые ожидает build.sh
      - name: Export NDK Paths
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.3.11579264" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/26.3.11579264" >> "${GITHUB_ENV}"

      - name: Build
        env:
          BENZWARE_STATUS_URL: ${{ vars.BENZWARE_STATUS_URL }}
        shell: bash
        run: |
          node tests/remote_gate/worker.test.mjs
          sh tests/remote_gate/native.test.sh
          chmod +x build.sh
          ./build.sh

          file libs/arm64-v8a/benzware.sh
          sha256sum libs/arm64-v8a/benzware.sh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: benzware-sh-arm64-v8a
          path: libs/arm64-v8a/benzware.sh
          if-no-files-found: error
          
