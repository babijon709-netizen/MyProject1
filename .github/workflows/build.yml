name: Build xvcen

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.3.11579264

jobs:
  build:
    name: Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        run: |
          "${ANDROID_NDK_HOME}/ndk-build" \
            NDK_PROJECT_PATH="${GITHUB_WORKSPACE}" \
            APP_BUILD_SCRIPT="${GITHUB_WORKSPACE}/jni/Android.mk" \
            NDK_APPLICATION_MK="${GITHUB_WORKSPACE}/jni/Application.mk" \
            V=1

          test -f "${GITHUB_WORKSPACE}/libs/arm64-v8a/xvcen"

          mkdir -p dist
          cp "${GITHUB_WORKSPACE}/libs/arm64-v8a/xvcen" \
             dist/xvcen-arm64-v8a

          file dist/xvcen-arm64-v8a
          sha256sum dist/xvcen-arm64-v8a

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: xvcen-arm64-v8a
          path: dist/xvcen-arm64-v8a
          if-no-files-found: error
