name: Build benzware.sh

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

# write — шаг «Release binary» кладёт бинарник в релиз nightly.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.3.11579264

jobs:
  build:
    name: Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Build
        id: android_build
        shell: bash
        run: |
          set -o pipefail
          "${ANDROID_NDK_HOME}/ndk-build" \
            NDK_PROJECT_PATH="${GITHUB_WORKSPACE}" \
            APP_BUILD_SCRIPT="${GITHUB_WORKSPACE}/jni/Android.mk" \
            NDK_APPLICATION_MK="${GITHUB_WORKSPACE}/jni/Application.mk" \
            V=1 2>&1 | tee "${RUNNER_TEMP}/ndk-build.log"

          test -f "${GITHUB_WORKSPACE}/libs/arm64-v8a/xvcen"

          mkdir -p dist
          cp "${GITHUB_WORKSPACE}/libs/arm64-v8a/xvcen" dist/benzware.sh
          cp "${GITHUB_WORKSPACE}/libs/arm64-v8a/xvcen" dist/xvcen-arm64-v8a
          chmod 755 dist/benzware.sh dist/xvcen-arm64-v8a

          file dist/benzware.sh
          sha256sum dist/benzware.sh dist/xvcen-arm64-v8a

      - name: Report build diagnostics
        if: failure() && steps.android_build.outcome == 'failure'
        env:
          NDK_BUILD_LOG: ${{ runner.temp }}/ndk-build.log
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          log = Path(os.environ["NDK_BUILD_LOG"])
          lines = log.read_text(errors="replace").splitlines() if log.exists() else []
          matches = [line for line in lines if re.search(
              r"(fatal error:|error:|undefined reference|ld\.lld:|make: \*\*\*)", line,
              re.IGNORECASE)]
          if not matches:
              matches = lines[-80:]
          for line in matches[-80:]:
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=ndk-build::{escaped}")
          PY

      - name: Release binary
        id: release
        if: always() && hashFiles('dist/benzware.sh') != ''
        # Бинарник уходит в релиз, а не в артефакт Actions: ассет релиза лежит
        # в хранилище репозитория, которое не зависит от квоты артефактов (она
        # забита и пересчитывается 6-12 ч, отсюда «Failed to CreateArtifact»).
        # Тег один и тот же, файлы перезаписываются --clobber.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 ||
            gh release create nightly \
              --target "${GITHUB_SHA}" \
              --title "nightly (${GITHUB_REF_NAME})" \
              --notes "Автосборка ветки ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA}" \
              --prerelease
          gh release upload nightly dist/benzware.sh dist/xvcen-arm64-v8a --clobber
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/tag/nightly" >> "$GITHUB_OUTPUT"
          echo "file=https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/benzware.sh" >> "$GITHUB_OUTPUT"

      - name: Итог сборки
        if: always() && hashFiles('dist/benzware.sh') != ''
        run: |
          if [ "${{ steps.release.outcome }}" = "success" ]; then
            echo "релиз  : ${{ steps.release.outputs.url }}"
            echo "скачать: ${{ steps.release.outputs.file }}"
          else
            echo "::error::релиз nightly не залился — смотри лог шага выше"
          fi
          sha256sum dist/benzware.sh dist/xvcen-arm64-v8a
          file dist/benzware.sh
