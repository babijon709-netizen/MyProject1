name: Build benzware.sh

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

# Release assets avoid the repository's exhausted Actions artifact quota.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.3.11579264

jobs:
  build:
    name: Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        run: |
          "${ANDROID_NDK_HOME}/ndk-build" \
            -j"$(nproc)" \
            NDK_PROJECT_PATH="${GITHUB_WORKSPACE}" \
            APP_BUILD_SCRIPT="${GITHUB_WORKSPACE}/jni/Android.mk" \
            NDK_APPLICATION_MK="${GITHUB_WORKSPACE}/jni/Application.mk" \
            V=1

      - name: Package benzware.sh
        id: package
        shell: bash
        run: |
          test -s "${GITHUB_WORKSPACE}/libs/arm64-v8a/xvcen"
          install -Dm755 "${GITHUB_WORKSPACE}/libs/arm64-v8a/xvcen" dist/benzware.sh
          install -m755 dist/benzware.sh dist/xvcen-arm64-v8a

          file dist/benzware.sh
          (
            cd dist || exit 1
            sha256sum benzware.sh xvcen-arm64-v8a > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Release binary
        id: release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 ||
            gh release create nightly \
              --target "${GITHUB_SHA}" \
              --title "nightly (${GITHUB_REF_NAME})" \
              --notes "Android arm64-v8a build from ${GITHUB_REF_NAME}, commit ${GITHUB_SHA}" \
              --prerelease
          gh release upload nightly dist/benzware.sh dist/xvcen-arm64-v8a dist/SHA256SUMS --clobber
          gh release edit nightly \
            --title "nightly (${GITHUB_REF_NAME})" \
            --notes "Android arm64-v8a build from ${GITHUB_REF_NAME}, commit ${GITHUB_SHA}. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/nightly" >> "$GITHUB_OUTPUT"
          echo "file=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/nightly/benzware.sh" >> "$GITHUB_OUTPUT"

      - name: Build summary
        if: always() && steps.package.outcome == 'success'
        shell: bash
        env:
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_FILE: ${{ steps.release.outputs.file }}
        run: |
          {
            echo "### Android arm64-v8a"
            echo
            printf "Commit: \`%s\`\n\n" "${GITHUB_SHA}"
            if [ "${RELEASE_OUTCOME}" = "success" ]; then
              printf '[Download benzware.sh](%s)\n\n' "${RELEASE_FILE}"
              printf '[Nightly release](%s)\n\n' "${RELEASE_URL}"
            elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "Pull request build only; release publication is skipped."
            else
              echo "Release publication failed; see the Release binary step."
            fi
            echo
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS
          file dist/benzware.sh
